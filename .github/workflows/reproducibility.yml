name: Reproducibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'datasets/**'
      - 'tools/**'
      - 'tests/**'
      - 'reproduce.py'
      - 'requirements.txt'
      - 'manifest.json'
      - 'service_revision_r43/**'
      - '.github/workflows/reproducibility.yml'
  pull_request:
permissions:
  contents: read
jobs:
  scientific-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python reproduce.py --fresh-dir "${{ runner.temp }}/project37-fresh"
      - run: python tools/compare_outputs.py --fresh-dir "${{ runner.temp }}/project37-fresh"
  service-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r service_revision_r43/requirements.txt
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tests -v
        working-directory: service_revision_r43
      - run: python src/reproduce_revision_with_artwork_r43.py
        working-directory: service_revision_r43
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-revision-diagnostics
          path: |
            service_revision_r43/logs/
            service_revision_r43/results/full_output_comparison.json
            service_revision_r43/results/r43_integrated_reproduction.json
            service_revision_r43/output/graphical_abstract/graphical_abstract_audit.json
            service_revision_r43/results/artwork/**/Fig*_panel_*_data.csv
